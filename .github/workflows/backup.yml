name: DB Backup

# Cron nocturno: 03:00 UTC todos los días. Coincide con baja actividad
# (ventas Hotmart concentran 08-22h LATAM = 13-03h UTC, así que 03 UTC
# es lo más quieto).
on:
  schedule:
    - cron: '0 3 * * *'
  # Permite trigger manual desde Actions UI para verificar.
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: pg_dump → R2 cifrado
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BACKUP_BUCKET }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      S3_REGION: auto
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_RETENTION_DAYS: '30'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # La versión TIENE que ser >= la del servidor: `pg_dump` se niega a
      # respaldar una base más nueva que él. Producción corre Postgres 18.6
      # (comprobado el 2026-09-24) y aquí se instalaba la 16, así que el
      # respaldo habría fallado igual aunque los secretos estuvieran puestos.
      # Si algún día Railway sube de versión, esta línea sube con ella.
      - name: Instalar pg_dump 18 (la versión de producción)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          # `apt-key` está retirado: la llave va a su propio archivo.
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc             -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main"             | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          pg_dump --version

      - name: Install @aws-sdk/client-s3
        working-directory: backend
        run: npm ci

      - name: Run backup
        working-directory: backend
        run: node scripts/backup-db.mjs

      # Aquí había un paso «Notify Sentry on failure» que NUNCA corrió: dependía
      # de un secreto SENTRY_DSN que no existe. Resultado real: 135 noches
      # seguidas de fallo (mayo-septiembre 2026) sin un solo aviso. Se quitó a
      # propósito y no se reemplaza por otro aviso-desde-el-que-falla, porque un
      # avisador que vive dentro del job muere con el job. El aviso real vigila
      # el RESULTADO desde fuera: VigilanteService.respaldoQueNoExiste() revisa
      # cada día a las 13:00 UTC que exista un respaldo de menos de 26 h en el
      # bucket y manda SMS al equipo si no. Da igual si falló el job, si se
      # borraron los secretos o si GitHub desactivó el cron por 60 días sin
      # actividad: sin objeto fresco, suena.
