name: DB Backup

# Cron nocturno: 03:00 UTC todos los días. Coincide con baja actividad
# (ventas Hotmart concentran 08-22h LATAM = 13-03h UTC, así que 03 UTC
# es lo más quieto).
on:
  schedule:
    - cron: '0 3 * * *'
  # Permite trigger manual desde Actions UI para verificar.
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: pg_dump → R2 cifrado
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BACKUP_BUCKET }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      S3_REGION: auto
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_RETENTION_DAYS: '30'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install pg_dump (matching prod Postgres version)
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Install @aws-sdk/client-s3
        working-directory: backend
        run: npm ci

      - name: Run backup
        working-directory: backend
        run: node scripts/backup-db.mjs

      - name: Notify Sentry on failure
        if: failure() && env.SENTRY_BACKUP_DSN != ''
        env:
          SENTRY_BACKUP_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          curl -X POST "${SENTRY_BACKUP_DSN}/api/store/" \
            -H 'Content-Type: application/json' \
            -d '{"message":"DB backup failed","level":"error","tags":{"job":"github-actions-backup"}}'
